# Shared package defaults. Device DPI sets missing font size and margins.
# Saved user and book settings override these defaults.
font.face.default=DejaVu Sans
crengine.font.fallback.face=DejaVu Sans
crengine.interline.space=110
crengine.hyphenation.directory=@algorithm
crengine.footnotes=1
crengine.doc.embedded.fonts.enabled=1
crengine.doc.embedded.styles.enabled=1
crengine.page.header.font.face=DejaVu Sans
window.status.line=0
window.status.pos.page.number=1
window.status.pos.page.count=1
window.status.battery=1
window.status.clock=1
window.landscape.pages=2
window.pinch.zoom=1
window.swipes.pageturn=1
window.swipes.frontlight=2
pocketbook.system.custom_theme=0
pocketbook.toc.use_new_touch_toc=1
